<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathBop! 🚀</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">
        <div id="name-screen" class="card">
            <span class="emoji">🐶</span>
            <h1>MathBop!</h1>
            <p>Hi! What is your name, Pilot?</p>
            <input type="text" id="name-input" placeholder="Your Name..." autocomplete="off">
            <button onclick="saveName()">GET MY WINGS!</button>
        </div>

        <div id="home-screen" class="card hidden">
            <h1 id="welcome-msg">Welcome, Pilot!</h1>
            
            <div class="mission-toggle">
                <button id="math-mode-btn" class="mode-btn active" onclick="setMode('math')">🔢 Math</button>
                <button id="money-mode-btn" class="mode-btn" onclick="setMode('money')">💰 Money</button>
            </div>

        <div id="money-cheat-sheet" class="cheat-sheet hidden">
            <div class="cheat-item"><img src="https://upload.wikimedia.org/wikipedia/commons/2/2e/US_One_Cent_Obv.png" class="mini-coin"> Penny (1¢)</div>
            <div class="cheat-item"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Jefferson-Nickel-Unc-Obv.jpg/640px-Jefferson-Nickel-Unc-Obv.jpg" class="mini-coin"> Nickel (5¢)</div>
            <div class="cheat-item"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/2015-W_proof_Roosevelt_dime_obverse.jpg/640px-2015-W_proof_Roosevelt_dime_obverse.jpg" class="mini-coin"> Dime (10¢)</div>
            <div class="cheat-item"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/2006_Quarter_Proof.png/640px-2006_Quarter_Proof.png" class="mini-coin"> Quarter (25¢)</div>
        </div>

            <div class="stats-row">
                <span>🏆 High Score: <span id="hi-score">0</span></span>
                <span>💰 Coins: <span id="total-coins">0</span></span>
            </div>
            
            <div id="math-settings" class="settings">
                <div class="setting-row">
                    <span>🌟 Level:</span>
                    <select id="difficulty-select">
                        <option value="easy">Easy (1-10)</option>
                        <option value="medium">Medium (1-20)</option>
                        <option value="hard">Hard (Double Digits!)</option>
                    </select>
                </div>
                <div class="operators-row">
                    <button class="op-btn active" data-op="+">+</button>
                    <button class="op-btn" data-op="-">-</button>
                    <button class="op-btn" data-op="x">×</button>
                    <button class="op-btn" data-op="/">÷</button>
                </div>
            </div>

            <div class="setting-row">
                <span>⏱️ Speed:</span>
                <input type="range" id="speed-slider" min="5" max="40" value="15">
                <span id="speed-val">15 s</span>
            </div>

            <button onclick="startGame()" class="start-btn">START MISSION! 🚀</button>
        </div>

        <div id="game-screen" class="card hidden">
            <div id="timer-container"><div id="timer-bar"></div></div>
            <div class="stats-bar">
                <span>💰 <span id="session-coins">0</span></span>
                <span>🚀 <span id="q-current">1</span>/10</span>
                <span>🔥 <span id="streak-count">0</span></span>
            </div>
            <div class="problem">
                <span id="n1">0</span>
                <span id="op-sign">+</span>
                <span id="n2">0</span>
                <span>=</span>
                <input type="number" id="answer-input" pattern="\d*" inputmode="numeric">
            </div>
            <div id="status-label" class="status-text">&nbsp;</div>
            <div class="game-controls">
                <button onclick="startGame()" class="control-btn mini">🔄 Restart</button>
                <button onclick="goToHome()" class="control-btn mini">🏠 Home</button>
            </div>
        </div>

        <div id="money-screen" class="card hidden">
            <div id="m-timer-container" class="timer-container"><div id="m-timer-bar" class="timer-bar"></div></div>
            <div class="stats-bar">
                <span>💰 <span id="m-session-coins">0</span></span>
                <span>🪙 <span id="m-q-current">1</span>/10</span>
            </div>
            <div class="mission-instruction">Count the cents and type the total!</div>
            <div id="money-display" class="money-box"></div>
            <div class="problem">
                <span class="total-label">Total Cents:</span>
                <input type="number" id="money-input" pattern="\d*" inputmode="numeric">
            </div>
            <div id="money-status" class="status-text">&nbsp;</div>
            <div class="game-controls">
                <button onclick="startGame()" class="control-btn mini">🔄 Restart</button>
                <button onclick="goToHome()" class="control-btn mini">🏠 Home</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
